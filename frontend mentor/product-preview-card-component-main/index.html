<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="images/image-product-desktop.jpg" alt="product">
        <div class="content">
            <p class="type">P E R F U M E</p>
            <span class="name">
                <p>Gabrielle</p>
                <p>Essence Eau</p>
                <p>De Parfum</p>
            </span>
            <span class="about">
                <p>A floral, solar and vouptuous</p>
                <p>Interpretation compas by</p>
                <p>Olvir Page, Perfumer Creator</p>
                <p>for the House of CHANEL.</p>
            </span>
            <span class="price">
                $149.99
                <p class="cut">$169.99</p>
            </span>
            <button class="click">
                <div id="text">
                    <img src="images/icon-cart.svg" alt="cart">
                    Add to Cart
                </div>
            </button>
        </div>
    </div>
</body>
</html>
