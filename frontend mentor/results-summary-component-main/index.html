<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results Summary Component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">

    <!-- ============ Left: Your Result ============ -->
    <section class="result">
      <h1 class="result__title">Your Result</h1>

      <div class="result__score-ring">
        <span class="result__score">76</span>
        <span class="result__total">of 100</span>
      </div>

      <p class="result__rating">Great</p>
      <p class="result__text">
        You scored higher than 65% of the people who have taken these tests.
      </p>
    </section>

    <!-- ============ Right: Summary ============ -->
    <section class="summary">
      <h2 class="summary__title">Summary</h2>

      <ul class="summary__list">
        <li class="summary__item summary__item--reaction">
          <span class="summary__label">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M11.9 2.2 5 11.5h4.3L8 17.8l6.9-9.3h-4.3l1.3-6.3Z"
                    stroke="#F55" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Reaction
          </span>
          <span class="summary__value"><b>80</b> / 100</span>
        </li>

        <li class="summary__item summary__item--memory">
          <span class="summary__label">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <g stroke="#FFB21E" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 3.333H6.667A4.167 4.167 0 0 0 2.5 7.5v5a4.167 4.167 0 0 0 4.167 4.167H10V3.333Z"/>
                <path d="M10 3.333h3.333A4.167 4.167 0 0 1 17.5 7.5v5a4.167 4.167 0 0 1-4.167 4.167H10V3.333Z"/>
                <path d="M8.333 7.5H6.667A1.667 1.667 0 0 0 5 9.167v1.666a1.667 1.667 0 0 0 1.667 1.667h1.666"/>
                <path d="M11.667 7.5h1.666A1.667 1.667 0 0 1 15 9.167v1.666a1.667 1.667 0 0 1-1.667 1.667h-1.666"/>
              </g>
            </svg>
            Memory
          </span>
          <span class="summary__value"><b>92</b> / 100</span>
        </li>

        <li class="summary__item summary__item--verbal">
          <span class="summary__label">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <g stroke="#00BB8F" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7.5 6.25V4.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2.667a2 2 0 0 1-2 2h-.083"/>
                <path d="M4.583 6.25H13.125a2.292 2.292 0 0 1 2.292 2.292v2.708a2.292 2.292 0 0 1-2.292 2.292H7.917l-3.334 2.916v-2.916a2.292 2.292 0 0 1-2.291-2.292V8.542A2.292 2.292 0 0 1 4.583 6.25Z"/>
              </g>
            </svg>
            Verbal
          </span>
          <span class="summary__value"><b>61</b> / 100</span>
        </li>

        <li class="summary__item summary__item--visual">
          <span class="summary__label">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <g stroke="#1125D4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.083 10C3.65 6.25 6.667 4.167 10 4.167s6.35 2.083 7.917 5.833c-1.567 3.75-4.586 5.833-7.917 5.833S3.65 13.75 2.083 10Z"/>
                <circle cx="10" cy="10" r="2.5"/>
              </g>
            </svg>
            Visual
          </span>
          <span class="summary__value"><b>73</b> / 100</span>
        </li>
      </ul>

      <button class="summary__button" type="button">Continue</button>
    </section>

  </main>

</body>
</html>
