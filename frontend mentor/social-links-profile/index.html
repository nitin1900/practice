<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social links profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="content">
            <div class="profile">
                <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
                <h1 class="name">Jessica Randall</h1>
                <p class="location">London, United Kingdom</p>
            </div>
            
            <p class="description">"Front-end developer and avid reader"</p>
            
            <ul class="social">
                <li><a href="#" class="crax">GitHub</a></li>
                <li><a href="#" class="crax">Frontend Mentor</a></li>
                <li><a href="#" class="crax">LinkedIn</a></li>
                <li><a href="#" class="crax">Twitter / X</a></li>
                <li><a href="#" class="crax">Instagram</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
