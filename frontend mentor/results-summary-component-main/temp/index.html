<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result-summary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">

        <div class="content">

            <div class="mini">
                <p>your result</p>
                <h1>76</h1>
                <p>out of 100</p>
                <h1>Great</h1>
                <p>You scored higher than 65% of</p>
                <p>the people who have taken</p>
                <p>these tests.</p>
            </div>
            
            <div class="score">
                <h3>Summary</h3>
                <div class="reaction">
                    <p>Reaction</p>
                    <span>80/100</span>
                </div>
                <div class="memory">
                    <p>Memory</p>
                    <span>92/100</span>
                </div>
                <div class="verbal">
                    <p>Verbal</p>
                    <span>61/100</span>
                </div>
                <div class="visual">
                    <p>Visual</p>
                    <span>72/100</span>
                </div>
                <button>Continue</button>
            </div>
            
        </div>

    </div>
</body>

</html>
