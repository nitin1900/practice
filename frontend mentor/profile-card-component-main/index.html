<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile-card-component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <img src="images/bg-pattern-top.svg" alt="pattern-top" class="top">
    <img src="images/bg-pattern-bottom.svg" alt="pattern-bottom" class="bottom"> -->
    <div class="card">
        <img src="images/bg-pattern-card.svg" alt="banner" class="banner">
        <div class="card-body">
            <img src="images/image-victor.jpg" alt="DP" id="DPs">
            <div class="title">
                <h5>Victor Crest</h5>
                <p class="tc">26</p>
            </div>
            <p class="tc">London</p>
        </div>
        <div class="stat">
            <div class="t1">
                <h3>80K</h3>
                <p class="tc">followers</p>
            </div>
            <div class="t2">
                <h3>803K</h3>
                <p class="tc">Likes</p>
            </div>
            <div class="t3">
                <h3>1.4K</h3>
                <p class="tc">photos</p>
            </div>
        </div>
    </div>
</body>
</html>
