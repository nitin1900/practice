<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Input and button to create new tasks -->
    <input type="text" id="task-input" placeholder="Enter a task..." />
    <button id="add-btn">Add New Task</button>

    <!-- Container holding all task sections -->
    <main id="task-list">
      <section class="task">
        <label>
          <input type="checkbox" class="subscribe" />
          click me
        </label>
        <button class="delete-btn">Delete Task</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
