<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nft-preview-card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="content">
            <div class="img">
                <img src="images/image-equilibrium.jpg" id="bg" alt="Equilibrium bg">
                <div class="overlay">
                    <img src="images/icon-view.svg" alt="view icon">
                </div>
            </div>
            <h4 class="give">Equilibrium #3429</h4>
            <span id="pog">
                <p>Our Equilibrium collection promotes</p>
                <p>balance and calm.</p>
            </span>
            <div class="pd">
                <div class="price">
                    <img src="images/icon-ethereum.svg" alt="ethereum">
                    <p class="give">0.041ETH</p>
                </div>
                <div class="date">
                    <img src="images/icon-clock.svg" alt="clock">
                    <p>3 days left</p>
                </div>
            </div>
            <div class="profile">
                <img src="images/image-avatar.png" id="pp" alt="DP">
                <p>Creation of</p>
                <p class="give">Jules Wyvern</p>
            </div>
        </div>
    </div>
</body>
</html>
