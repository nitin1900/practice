<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="display">0</div>
      <section>
        <button type="reset" class="btn-clear">AC</button>
        <button class="operator">/</button>
        <button class="operator">*</button>
        <button class="btn-clear">C</button>
      </section>
      <section>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">-</button>
      </section>
      <section>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">+</button>
      </section>
      <section>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+/-</button>
      </section>
      <section>
        <button class="btn-zero">0</button>
        <button>.</button>
        <button class="btn-equal">=</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
