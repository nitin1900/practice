<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <img src="images/pattern-background-desktop.svg" alt="bg"> -->
    <div class="card">
        <img src="images/illustration-hero.svg" id="ima" alt="poster">
        <span class="temp">
            <h2>Order Summary</h2>
            <div class="content">
                <p>You can now listen to millions of songs,</p>
                <p>audiobooks, and podcasts on any device</p>
                <p>anywhere you like!</p>
            </div>
        </span>
        <div class="plan">
            <span class="temp2">
                <img src="images/icon-music.svg" alt="music">
                <span>
                    <h5>Annual Plan</h5>
                    <p class="content">$59.99/year</p>
                </span>
            </span>
            <a href="#">Change</a>
        </div>
        <button id="purple">Procced to Payment</button>
        <button id="white">Cancel Order</button>
    </div>
</body>
</html>
