<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog-card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">

        <div class="content">

            <div class="img-back">
                <img src="assets/images/illustration-article.svg" alt="background">
            </div>

            <span class="box">Learning</span>

            <p class="date">Published 12 Aug 2026</p>

            <h2><a href="#">HTML & CSS foundations</a></h2>

            <p class="description">
                These languages are the backbone of every
                website, defining structure, content, and
                presentation.
            </p>

            <div class="profile">
                <img src="assets/images/image-avatar.webp" alt="DP">
                <span class="name">Nitin</span>
            </div>

        </div>

    </div>
</body>
</html>
